{{ define "main" }}
  <div class="site-container">
    <article class="content h-entry">
      <h1>{{ .Title }}</h1>
      {{ .Content }}

      {{ with site.Home.OutputFormats.Get "searchIndex" }}
        <form class="search-form" role="search" data-search-form data-search-index="{{ .RelPermalink }}"
          data-loading-label="{{ i18n `search_loading` }}" data-error-label="{{ i18n `search_error` }}"
          data-empty-label="{{ i18n `search_empty` }}" data-results-label="{{ i18n `search_results` }}">
          <label for="site-search">{{ i18n "search_site" }}</label>
          <div class="search-form__controls">
            <input id="site-search" name="q" type="search" required autocomplete="off">
            <button type="submit">{{ i18n "search" }}</button>
          </div>
        </form>
      {{ end }}

      <p class="search-status" data-search-status aria-live="polite"></p>
      <ol class="search-results" data-search-results></ol>
      <noscript><p>{{ i18n "search_requires_javascript" }}</p></noscript>
    </article>
  </div>
{{ end }}

{{ define "main" }}
  <section class="content">
    <h1>{{ .Title }}</h1>

    {{ range .Data.Terms.Alphabetical }}
      <article>
        <h2><a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}</a></h2>
        <p>{{ .Count }} page{{ if ne .Count 1 }}s{{ end }}</p>
      </article>
    {{ end }}
  </section>
{{ end }}

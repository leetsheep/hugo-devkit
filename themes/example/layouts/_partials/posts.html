{{ with first 3 (where site.RegularPages.ByDate.Reverse "Section" "posts") }}
  <section class="posts" aria-labelledby="posts-heading">
    <h2 id="posts-heading">Posts</h2>

    <div class="page-list">
      {{ range . }}
        {{ partial "content/card.html" . }}
      {{ end }}
    </div>
  </section>
{{ end }}

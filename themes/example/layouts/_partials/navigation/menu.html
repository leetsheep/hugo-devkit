{{ $page := .page }}
{{ with index site.Menus .menuID }}
  <nav class="site-nav" aria-label="{{ i18n `main_navigation` }}">
    <ul>
      {{ range . }}
        <li>
          <a href="{{ .URL }}"{{ if $page.IsMenuCurrent $.menuID . }} aria-current="page"{{ else if $page.HasMenuCurrent $.menuID . }} aria-current="true"{{ end }}>
            {{ .Name }}
          </a>
        </li>
      {{ end }}
    </ul>
  </nav>
{{ end }}

{{ $page := .page }}
{{ with index site.Menus .menuID }}
  <nav class="site-nav" aria-label="{{ i18n `main_navigation` }}">
    <ul>
      {{ range . }}
        <li>
          <a href="{{ .URL }}"{{ if eq .Identifier "search" }} class="search-link"{{ end }}{{ if $page.IsMenuCurrent $.menuID . }} aria-current="page"{{ else if $page.HasMenuCurrent $.menuID . }} aria-current="true"{{ end }}>
            {{ if eq .Identifier "search" }}
              <span class="visually-hidden">{{ .Name }}</span>
              {{ partialCached "icons/search.html" . }}
            {{ else }}
              {{ .Name }}
            {{ end }}
          </a>
        </li>
      {{ end }}
    </ul>
  </nav>
{{ end }}

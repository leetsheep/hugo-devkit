{{ if or .NextInSection .PrevInSection }}
  <nav class="page-nav" aria-label="{{ i18n `section_navigation` }}">
    {{ with .NextInSection }}<a rel="next" href="{{ .RelPermalink }}">← {{ .LinkTitle }}</a>{{ end }}
    {{ with .PrevInSection }}<a rel="prev" href="{{ .RelPermalink }}">{{ .LinkTitle }} →</a>{{ end }}
  </nav>
{{ end }}

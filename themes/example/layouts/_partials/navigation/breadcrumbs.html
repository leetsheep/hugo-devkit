{{ if not .IsHome }}
  <nav class="breadcrumbs site-container" aria-label="{{ i18n `breadcrumbs` }}">
    <ol>
      {{ range .Ancestors.Reverse }}
        <li><a href="{{ .RelPermalink }}">{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .LinkTitle }}{{ end }}</a></li>
      {{ end }}
      <li aria-current="page">{{ .LinkTitle }}</li>
    </ol>
  </nav>
{{ end }}

{{ define "main" }}
  <section class="listing site-container">
    <header class="listing-header">
      <h1>{{ .Title }}</h1>
      {{ .Content }}
      {{ partial "content/pagination-note.html" . }}
    </header>

    {{ $paginator := .Paginate .RegularPages.ByWeight }}
    <div class="page-list">
      {{ range $paginator.Pages }}
        {{ partial "content/card.html" . }}
      {{ end }}
    </div>
    {{ partial "pagination.html" . }}
  </section>
{{ end }}
